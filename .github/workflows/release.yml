name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install C++ toolchain (for gojieba / cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Linux binaries
        run: |
          export CGO_ENABLED=1

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o onePushBot-linux-amd64 .

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o onePushBot-linux-arm64 .

      - name: Create checksums
        run: sha256sum onePushBot-* > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            awk '/^## \[${{ steps.get_version.outputs.VERSION }}\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=See commit history for changes in this release." >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: onePushBot ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## onePushBot ${{ steps.get_version.outputs.VERSION }}

            ### Linux 下载

            - **Linux (amd64)**: `onePushBot-linux-amd64`
            - **Linux (arm64)**: `onePushBot-linux-arm64`

            赋予执行权限：
            ```bash
            chmod +x onePushBot-*
            ```

            ### 源码

            Release 内附带当前版本源码压缩包（GitHub 自动提供）。

            ### 校验和

            可使用以下命令验证二进制完整性：
            ```bash
            sha256sum -c checksums.txt
            ```

            ### 更新日志

            ${{ steps.changelog.outputs.CHANGELOG }}

          files: |
            onePushBot-linux-amd64
            onePushBot-linux-arm64
            checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.get_version.outputs.VERSION }}
          path: |
            onePushBot-linux-amd64
            onePushBot-linux-arm64
            checksums.txt
          retention-days: 30
